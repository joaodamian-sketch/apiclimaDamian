<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clima Perú</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://jsdelivr.net" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

  <header class="container text-center my-4">
    <h1>CLIMA PERÚ</h1>
    <p>Aquí veremos el clima de nuestro país.</p>
  </header>

  <main class="container">
    <section class="buscador">
      <select id="selectorCiudad" class="form-control"> 
        <option value="lima">Lima</option>
        <option value="cusco">Cusco</option>
        <option value="arequipa">Arequipa</option>
        <option value="trujillo">Trujillo</option>
        <option value="piura">piura</option>
        <option value="iquitos">iquitos</option>
        <option value="puno">puno</option>
        <option value="huancayo">huancayo</option>
      </select>
      <button id="btnConsultar" class="form-control w-20 mt-5 bg-dark text-white">VER CLIMA</button>  
    </section>

    <p id="mensajeError"></p>
                          
    <section id="resultado" class="card p-3 my-5"></section>
  </main>

  <footer class="container text-center my-5 pt-4 border-top">
    <p class="text-muted">&copy; <span id="year"></span> Joao Damian Espinoza. Todos los derechos reservados.</p>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

  <script src="app.js"></script>
  <script src="appcomplemento.js"></script>
  <script src="https://jsdelivr.net" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
